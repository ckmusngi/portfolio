<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cyrill Kiel Musngi — Full Stack Software Engineer building web apps, backend services, SaaS integrations, and payment systems."
    />
    <title>Cyrill Kiel Musngi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        const t = localStorage.getItem("theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Resolve the system theme too, so dark-only styles can key off data-theme
      if (!document.documentElement.dataset.theme) {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
      // In dark mode the page loads with its details hidden and scrolling locked
      // until the flashlight is on (see Flashlight.jsx), so don't restore a
      // scroll position
      history.scrollRestoration = "manual";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
